[package]
name = "portcanvas-core"
version = "0.5.95"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[features]
default = []
downloads = ["dep:reqwest", "dep:rustls"]

[dependencies]
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "system-proxy", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures-util = "0.3"
if-addrs = "=0.14.0"
tokio-tungstenite = "0.28"
zeroize = "1"
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
ring = "0.17"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
