[package]
name = "portcanvas-native-probe"
version = "0.6.0-dev.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
default-run = "PortCanvasNative"

[features]
default = []
gui = ["dep:slint", "dep:arboard", "dep:rfd"]

[[bin]]
name = "PortCanvasNative"
path = "src/workbench_main.rs"
required-features = ["gui"]

[[bin]]
name = "PortCanvasNativeProbe"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
portcanvas-core = { path = "../core", features = ["downloads"] }
alacritty_terminal = "=0.26.0"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.15", optional = true }
zeroize = "1"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
minisign-verify = "=0.3.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
vnc = { package = "vnc-rs", version = "=0.6.0", path = "../vendor/vnc-rs" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
slint = { version = "=1.15.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2", "unstable-winit-030"] }
arboard = { version = "3.6", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
flate2 = "1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
rand = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
