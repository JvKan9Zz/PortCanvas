[package]
name = "portcanvas"
version = "0.5.95"
edition = "2021"
rust-version = "1.90"
license = "MIT"
default-run = "PortCanvas"
autobins = false

[lib]
name = "studio_core"
path = "src/lib.rs"

[[bin]]
name = "PortCanvas"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "compat-probe"
path = "examples/compat_probe.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:tauri-plugin-updater", "dep:reqwest", "portcanvas-core/downloads", "windows-sys/Win32_UI_WindowsAndMessaging", "windows-sys/Win32_UI_Shell"]

[dependencies]
portcanvas-core = { path = "../core" }
tauri = { version = "2", optional = true, features = [] }
reqwest = { version = "0.13", optional = true, default-features = false }
rfd = { version = "0.15", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
anyhow = "1"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"], optional = true }



[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
base64 = "0.22"
tokio = { version = "1", features = ["test-util"] }
rand = "0.10"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
