[package]
name = "pc-capture-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
