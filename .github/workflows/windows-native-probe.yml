name: Windows native probe

on:
  pull_request:
    branches: [main]
    paths: ['app/native-probe/**', 'app/core/**', 'app/vendor/**', 'app/tools/build-native.sh', '.gitattributes', '.github/workflows/windows-native-probe.yml']
  push:
    branches: [main]
    paths: ['app/native-probe/**', 'app/core/**', 'app/vendor/**', 'app/tools/build-native.sh', '.gitattributes', '.github/workflows/windows-native-probe.yml']

permissions:
  contents: read

concurrency:
  group: native-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: cmd
        working-directory: app/native-probe
    env:
      WCS_TEST_ROOT: ${{ github.workspace }}/app/native-probe/target/isolated-tests
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust and isolated data
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File ci.ps1 setup'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/native-probe/target
          key: native-probe-rust190-${{ hashFiles('app/native-probe/Cargo.lock') }}
      - name: Test native terminal, RFB, system codecs and update signatures
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File ci.ps1 test'
      - name: Compile the Windows native GUI without bundling or signing
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File ci.ps1 build'
      - name: Run native shared-service smoke test without opening a window
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File ci.ps1 smoke'
      - name: Build standalone preview with the static Windows runtime
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
        run: bash ../tools/build-native.sh
      - name: Check standalone preview imports
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File ci.ps1 imports'
