name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File {0}'
        working-directory: app
    env:
      WCS_TEST_ROOT: ${{ github.workspace }}/app/src-tauri/target/ci-tests
      WCS_DATA_DIR: ${{ github.workspace }}/app/src-tauri/target/ci-data
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Rust and isolated test directories
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 is required.' }
          $PSVersionTable
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.90.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path $env:WCS_TEST_ROOT, $env:WCS_DATA_DIR | Out-Null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: windows-ci-rust190-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      - name: Install locked frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          exit $LASTEXITCODE
      - name: Build frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          exit $LASTEXITCODE
      - name: Check TypeScript
        run: |
          $ErrorActionPreference = 'Stop'
          npx --no-install tsc --noEmit
          exit $LASTEXITCODE
      - name: Test frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm run test:frontend
          exit $LASTEXITCODE
      - name: Test desktop helper
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests -p 'test_desktop*.py'
          exit $LASTEXITCODE
      - name: Test native core and desktop services
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib
          exit $LASTEXITCODE
      - name: Test isolated SSH lifecycle regressions
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --test ssh_lifecycle
          exit $LASTEXITCODE
      - name: Compile Windows application without packaging or signing
        run: |
          $ErrorActionPreference = 'Stop'
          npx --no-install tauri build --no-bundle --ci
          exit $LASTEXITCODE
