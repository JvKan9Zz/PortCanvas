name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: app
    env:
      WCS_TEST_ROOT: ${{ github.workspace }}/app/core/target/ci-tests
      WCS_DATA_DIR: ${{ github.workspace }}/app/core/target/ci-data
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/core/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Rust and isolated test directories
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File tools\ci.ps1 setup'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/core/target
          key: windows-core-rust190-${{ hashFiles('app/core/Cargo.lock') }}
      - name: Test desktop and camera helpers
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File tools\ci.ps1 python'
      - name: Test shared services and SSH lifecycle
        run: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File tools\ci.ps1 core'
