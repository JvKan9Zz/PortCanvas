name: macOS v0.5.95 compatibility build

on:
  push:
    branches: [feat/macos-v0.5.95]
    paths: [app/**, .github/workflows/macos-v0595.yml]
  workflow_dispatch:
    inputs:
      source_ref:
        description: v0.5.95 source ref to build
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: macos-v0595-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      WCS_TEST_ROOT: ${{ github.workspace }}/app/src-tauri/target/v0595-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify requested version
        run: test "$(node -p 'require("./package.json").version')" = '0.5.95'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare Rust targets
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: macos-v0595-arm64-rust190-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: macos-v056-rust190-
      - name: Frontend and helper checks
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
          npm run test:frontend
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Native Rust and Keychain tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target aarch64-apple-darwin --lib
      - name: Isolated SSH lifecycle tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --target aarch64-apple-darwin --test ssh_lifecycle
      - name: Build universal ad-hoc signed DMG
        run: npx tauri build --target universal-apple-darwin --bundles dmg --ci
      - name: Verify package and native WebKit media on Apple Silicon
        run: |
          swift tools/macos-media-fixture.swift src-tauri/target/v0595-media
          python3 tools/check-macos-package.py src-tauri/target/universal-apple-darwin/release/bundle/dmg src-tauri/target/v0595-macos-artifacts src-tauri/target/v0595-media
      - uses: actions/upload-artifact@v4
        with:
          name: macos-v0595-universal
          path: |
            app/src-tauri/target/v0595-macos-artifacts/*.dmg
            app/src-tauri/target/v0595-macos-artifacts/*.json
            app/src-tauri/target/v0595-macos-artifacts/*.png
            app/src-tauri/target/v0595-macos-artifacts/*.log
          retention-days: 7
          if-no-files-found: error

  intel-launch:
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      WCS_TEST_ROOT: ${{ github.workspace }}/app/src-tauri/target/v0595-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare native Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: macos-v0595-x86_64-rust190-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      - name: Build frontend for native tests
        working-directory: app
        run: npm ci && npm run build
      - name: Intel native Rust and Keychain tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked --release --lib
      - uses: actions/download-artifact@v4
        with:
          name: macos-v0595-universal
          path: app/src-tauri/target/macos-download
      - name: Verify same package and native WebKit media on Intel
        run: |
          swift app/tools/macos-media-fixture.swift app/src-tauri/target/v0595-media
          python3 app/tools/check-macos-package.py app/src-tauri/target/macos-download app/src-tauri/target/v0595-intel-artifacts app/src-tauri/target/v0595-media
      - uses: actions/upload-artifact@v4
        with:
          name: macos-v0595-intel-check
          path: |
            app/src-tauri/target/v0595-intel-artifacts/*.json
            app/src-tauri/target/v0595-intel-artifacts/*.png
            app/src-tauri/target/v0595-intel-artifacts/*.log
          retention-days: 7
          if-no-files-found: error
