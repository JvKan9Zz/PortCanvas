name: macOS native

on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'assets/brand/**', '.github/workflows/macos-native.yml']
  push:
    branches: [main]
    paths: ['app/**', 'assets/brand/**', '.github/workflows/macos-native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TARGET_DIR: ${{ runner.temp }}/portcanvas-target
      WCS_TEST_ROOT: ${{ runner.temp }}/portcanvas-tests
      WCS_DATA_DIR: ${{ runner.temp }}/portcanvas-tests/gui-data
      TMPDIR: ${{ runner.temp }}/portcanvas-temp/
      PORTCANVAS_TEST_KEYCHAIN_SERVICE: io.portcanvas.test.credentials.ci-${{ github.run_id }}-${{ github.run_attempt }}-universal
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Record host and install the pinned Rust targets
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcrun --show-sdk-version
          mkdir -p "$WCS_DATA_DIR" "$TMPDIR"
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/portcanvas-target
          key: macos26-${{ runner.arch }}-universal-rust190-${{ hashFiles('app/core/Cargo.lock', 'app/native-probe/Cargo.lock') }}
      - name: Test shared services and native platform contracts on the runner architecture
        run: |
          python3 -B app/tools/macos_test_keychain.py test --manifest-path app/core/Cargo.toml --locked --features downloads
          python3 -B app/tools/macos_test_keychain.py test --manifest-path app/native-probe/Cargo.toml --locked
          python3 -B -m unittest discover -s app/tests -p 'test_*.py'
      - name: Remove only exact test Keychain services recorded by this job
        if: always()
        run: python3 -B app/tools/macos_test_keychain.py cleanup
      - name: Build, inspect and ad-hoc sign the universal test app and DMG
        run: bash app/tools/build-macos.sh --output "$RUNNER_TEMP/portcanvas-macos-artifacts"
      - name: Preserve test packages and verification details for this PR
        uses: actions/upload-artifact@v4
        with:
          name: PortCanvas-0.6.2-macOS-universal-test
          path: |
            ${{ runner.temp }}/portcanvas-macos-artifacts/*.dmg
            ${{ runner.temp }}/portcanvas-macos-artifacts/*.app.tar.gz
            ${{ runner.temp }}/portcanvas-macos-artifacts/SHA256SUMS
            ${{ runner.temp }}/portcanvas-macos-artifacts/validation.json
          if-no-files-found: error
          retention-days: 14

  intel-compatibility:
    # Verified runner-images labels: macos-15-intel is x64; default Xcode is 16.4.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTUP_TOOLCHAIN: '1.90.0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TARGET_DIR: ${{ runner.temp }}/portcanvas-target
      WCS_TEST_ROOT: ${{ runner.temp }}/portcanvas-tests
      WCS_DATA_DIR: ${{ runner.temp }}/portcanvas-tests/gui-data
      TMPDIR: ${{ runner.temp }}/portcanvas-temp/
      PORTCANVAS_TEST_KEYCHAIN_SERVICE: io.portcanvas.test.credentials.ci-${{ github.run_id }}-${{ github.run_attempt }}-intel
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Record the Intel compatibility host and SDK
        run: |
          sw_vers
          test "$(uname -m)" = x86_64
          xcrun --show-sdk-version
          mkdir -p "$WCS_DATA_DIR" "$TMPDIR"
          rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/portcanvas-target
          key: macos15-intel-rust190-${{ hashFiles('app/core/Cargo.lock', 'app/native-probe/Cargo.lock') }}
      - name: Test shared and native contracts on Intel macOS 15
        run: |
          python3 -B app/tools/macos_test_keychain.py test --manifest-path app/core/Cargo.toml --locked --features downloads
          python3 -B app/tools/macos_test_keychain.py test --manifest-path app/native-probe/Cargo.toml --locked
          cargo check --manifest-path app/native-probe/Cargo.toml --locked --features gui
          python3 -B -m unittest discover -s app/tests -p 'test_*.py'
      - name: Remove only exact test Keychain services recorded by this job
        if: always()
        run: python3 -B app/tools/macos_test_keychain.py cleanup
